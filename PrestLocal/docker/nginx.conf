# ============================================================================
# PrestLocal — reverse proxy nginx
#
# Rôle :
#   - sert les fichiers statiques (/static/) et les médias (/media/) :
#     c'est indispensable car `runserver`/Daphne ne servent PAS les médias
#     quand DEBUG=False (photos de profil, réalisations, …) ;
#   - relaie le reste vers Daphne (Django ASGI) sur le service `web` ;
#   - gère l'upgrade WebSocket (/ws/) pour la messagerie temps réel.
# ============================================================================

upstream prestalocal_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads (photos de profil / réalisations)
    client_max_body_size 10M;

    # ---- Fichiers statiques (collectstatic) -------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Médias utilisateurs (uploads) ------------------------------------
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- WebSockets (chat + notifications) --------------------------------
    location /ws/ {
        proxy_pass http://prestalocal_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Application ------------------------------------------------------
    location / {
        proxy_pass http://prestalocal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
