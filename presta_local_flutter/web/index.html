<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LesProduFao — Trouvez les meilleurs prestataires locaux autour de vous.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LesProduFao">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LesProduFao</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Écran de chargement (retiré au premier rendu Flutter) */
    #lesprodufao-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background-color: #1E293B;
      z-index: 9999;
    }
    #lesprodufao-loader p {
      margin: 0;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <!-- Écran de chargement : logo LesProduFao pendant l'initialisation de Flutter -->
  <div id="lesprodufao-loader">
    <img src="icons/Icon-192.png" alt="LesProduFao" width="132" height="132">
    <p>LesProduFao</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('lesprodufao-loader');
      if (loader) loader.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
